[build-system]
requires = ["scikit-build-core>=0.9.0", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rocketsim-cuda"
version = "0.3.0"
description = "Ultra-parallel native C++/CUDA RocketSim physics engine with zero-copy PyTorch/DLPack tensors"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "RocketSim-CUDA Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Environment :: GPU :: NVIDIA CUDA",
]

[tool.scikit-build]
cmake.version = ">=3.24"
ninja.version = ">=1.11"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
CMAKE_CUDA_ARCHITECTURES = "80;86;89;90"
